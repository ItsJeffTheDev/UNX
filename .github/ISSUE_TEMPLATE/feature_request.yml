name: Feature request
description: Propose a language, CLI, package, or developer-experience improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that is currently difficult or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want. Include example UNX syntax or commands if useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches would solve the same problem?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Language syntax / runtime
        - CLI
        - .unx package format
        - Windows app / installer
        - Cross-platform support
        - VS Code / IDE
        - Documentation
        - Other
    validations:
      required: true
