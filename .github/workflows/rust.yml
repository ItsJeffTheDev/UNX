name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install stable Rust with formatting and lint tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Temporary visibility into formatting debt; this becomes blocking after the baseline is formatted.
      - name: Check Rust formatting (non-blocking baseline audit)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build
      - name: Run tests
        run: cargo test
